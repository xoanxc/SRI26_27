services:

  # Base de datos MySQL
  db:
    image: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: db_prueba
      MYSQL_USER: prueba
      MYSQL_PASSWORD: prueba
      MYSQL_ROOT_PASSWORD: prueba
    volumes:
      - ./bd:/docker-entrypoint-initdb.d
      - ./conf:/etc/mysql/conf.d
      - persistent:/var/lib/mysql
    networks:
      - default

  # Servicio Web 
  www:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./www:/var/www/html
    links:
      - db
    networks:
      - default

  # Interfaz PhpMyAdmin
  phpmyadmin:
    image: phpmyadmin
    links:
      - db:db
    ports:
      - 8000:80
    environment:
      MYSQL_DATABASE: db_prueba
      MYSQL_USER: prueba
      MYSQL_PASSWORD: prueba
      MYSQL_ROOT_PASSWORD: prueba

volumes:
  persistent:
